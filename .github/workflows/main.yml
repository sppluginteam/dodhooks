name: Build DODHooks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Windows: builds BOTH 32-bit (x86) and 64-bit (x64) in one job,
  # staging them into a single release-ready "dist" folder.
  # ------------------------------------------------------------------
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4

      - name: Checkout SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: deps/sourcemod
          submodules: recursive

      - name: Checkout Metamod:Source
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 1.12-dev
          path: deps/mmsource
          submodules: recursive

      - name: Checkout hl2sdk-dods
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: dods
          path: deps/hl2sdk-dods

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone AMBuild
        run: git clone https://github.com/alliedmodders/ambuild ambuild

      - name: Ensure build tools
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Install AMBuild
        run: python -m pip install --upgrade ./ambuild

      - name: Build (x86 + x64)
        shell: cmd
        run: build.bat

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/

  # ------------------------------------------------------------------
  # Linux: builds BOTH 32-bit (x86) and 64-bit (x64) in one job.
  # ------------------------------------------------------------------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4

      - name: Checkout SourceMod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: deps/sourcemod
          submodules: recursive

      - name: Checkout Metamod:Source
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 1.12-dev
          path: deps/mmsource
          submodules: recursive

      - name: Checkout hl2sdk-dods
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: dods
          path: deps/hl2sdk-dods

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib g++-multilib libstdc++6:i386

      - name: Clone AMBuild
        run: git clone https://github.com/alliedmodders/ambuild ambuild

      - name: Install AMBuild
        run: python3 -m pip install --upgrade ./ambuild

      - name: Install AMBuild (fallback - pip)
        if: failure()
        run: python3 -m pip install --upgrade ambuild || true

      - name: Make build script executable
        run: chmod +x ./build.sh

      - name: Build (x86 + x64)
        run: ./build.sh

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/

  # ------------------------------------------------------------------
  # Release: package the two "dist" folders into platform zips plus a
  # source zip, and publish them. Version is read from smsdk_config.h.
  # ------------------------------------------------------------------
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4

      - name: Extract version from smsdk_config.h
        id: version
        run: |
          VERSION=$(grep -oP '#define SMEXT_CONF_VERSION\s+"\K[^"]+' smsdk_config.h)
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

      - name: Download Windows dist
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: windows-dist

      - name: Download Linux dist
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: linux-dist

      - name: Assemble release archives
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "Version: ${VERSION}"

          # Windows zip (x86 + x64)
          (cd windows-dist && zip -r "../DODHooks-${VERSION}-sm1.12-windows.zip" addons)
          # Linux zip (x86 + x64)
          (cd linux-dist && zip -r "../DODHooks-${VERSION}-sm1.12-linux.zip" addons)

          echo "Created:"
          ls -la *.zip

      - name: Create source zip
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          git archive --format=zip --output="DODHooks-${VERSION}-source.zip" HEAD

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: DODHooks v${{ steps.version.outputs.VERSION }}
          make_latest: true
          files: |
            DODHooks-*-sm1.12-windows.zip
            DODHooks-*-sm1.12-linux.zip
            DODHooks-*-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
